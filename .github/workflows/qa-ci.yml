name: QA CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    if: ${{ github.event_name != 'pull_request' || !contains(github.actor, 'dependabot') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: npm run quality

  brand_mode_matrix:
    name: QA Matrix (${{ matrix.brand.key }} | ${{ matrix.mode }})
    if: ${{ github.event_name != 'pull_request' || !contains(github.actor, 'dependabot') }}
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        brand:
          - key: gt
            slug: gt.bet
          - key: likes
            slug: likes.bet
          - key: booms
            slug: booms.bet
          - key: nix
            slug: nix.bet
          - key: starzino
            slug: starzino.com
          - key: igo
            slug: igo.bet
          - key: chacha
            slug: chacha.bet
        mode: [desktop, mobile]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run QA matrix entry
        env:
          PW_HEADED: '0'
          PW_INCLUDE_DESTRUCTIVE: '0'
          PW_USE_AI_GENERATION: '0'
          PW_AI_REQUIRED: '0'
          PW_PRECHECK_SOFT: '1'
          PW_PROVIDER_PROFILE: 'smoke'
          PW_BUTTON_MAX_ROUTES: '12'
          PW_BUTTON_MAX_BUTTONS: '15'
          PW_BUTTON_MAX_ROUTE_DEPTH: '4'
          PW_PROVIDER_MAX: '6'
          PW_PROVIDER_RETRY_ON_FAIL: '0'
          PW_PROVIDER_DESKTOP_GAMES: '1'
          PW_PROVIDER_MIN_GAMES: '1'
          PW_PROVIDER_ENABLE_MOBILE: '1'
          PW_PROVIDER_TEST_TIMEOUT: '90000'
          PW_PROVIDER_MODE_TIMEOUT: '45000'
          PW_SAVE_STATE_TIMEOUT: '90'
          PW_FORCE_SAVE_STATE_BEFORE_RUN: '0'
        run: npm run qa:all:${{ matrix.brand.key }}:${{ matrix.mode }}

      - name: Upload QA artifacts (${{ matrix.brand.key }} | ${{ matrix.mode }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-${{ matrix.brand.slug }}-${{ matrix.mode }}
          if-no-files-found: warn
          path: |
            projects/${{ matrix.brand.slug }}/${{ matrix.mode }}/
            projects/${{ matrix.brand.slug }}/Autotest report/${{ matrix.mode }}/
