name: QA Nightly

on:
  workflow_dispatch:

concurrency:
  group: qa-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly_auth_bootstrap:
    name: Nightly Auth Bootstrap (${{ matrix.brand.slug }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        brand:
          - key: gt
            slug: gt.bet
          - key: likes
            slug: likes.bet
          - key: booms
            slug: booms.bet
          - key: nix
            slug: nix.bet
          - key: starzino
            slug: starzino.com
          - key: igo
            slug: igo.bet
          - key: chacha
            slug: chacha.bet
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run nightly auth bootstrap (registration + login)
        env:
          BASE_URL: https://${{ matrix.brand.slug }}
          QA_PROJECT_ROOT: projects/${{ matrix.brand.slug }}
          QA_PROJECT_SLUG: ${{ matrix.brand.slug }}
          QA_TEST_RESULTS_DIR: projects/${{ matrix.brand.slug }}/test-results
          QA_ARTIFACTS_DIR: projects/${{ matrix.brand.slug }}/artifacts
          QA_AUTOTEST_REPORT_DIR: projects/${{ matrix.brand.slug }}/Autotest report/bootstrap
          QA_ANALYZE_DIR: projects/${{ matrix.brand.slug }}/analyze
          PW_STORAGE_STATE: projects/${{ matrix.brand.slug }}/storageState.json
          PW_PROJECT_MATRIX: desktop
          PW_PRECHECK_PROJECT_MATRIX: desktop
          PW_BROWSER: chromium
          PW_HEADED: '0'
          PW_LOGIN_REQUIRE_REGISTERED: '1'
          PW_LOGIN_USE_ENV: '0'
          PW_LOGIN_ALLOW_SHARED_PLAYER: '0'
          PW_SIGNUP_VALIDATE_SIGNIN: '1'
          PW_SIGNUP_VALIDATE_SIGNIN_TIMEOUT_MS: '120000'
        run: npm run qa:bootstrap:auth

      - name: Normalize auth-state files
        run: |
          set -euo pipefail
          brand_root="projects/${{ matrix.brand.slug }}"
          artifacts_dir="${brand_root}/artifacts"
          mkdir -p "${brand_root}" "${artifacts_dir}"

          if [[ ! -f "${brand_root}/storageState.json" ]]; then
            for candidate in \
              "${artifacts_dir}/profile-auth-state.json" \
              "${artifacts_dir}/site-coverage-auth-state.json" \
              "${artifacts_dir}/button-sweep-auth-state.json"; do
              if [[ -f "${candidate}" ]]; then
                cp "${candidate}" "${brand_root}/storageState.json"
                echo "storageState restored from ${candidate}"
                break
              fi
            done
          fi

          if [[ ! -f "${brand_root}/storageState.json" ]]; then
            echo "::warning::nightly auth bootstrap did not produce storageState for ${{ matrix.brand.slug }}."
          fi

      - name: Upload nightly auth bootstrap artifacts (${{ matrix.brand.slug }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-auth-${{ matrix.brand.slug }}
          if-no-files-found: warn
          path: |
            projects/${{ matrix.brand.slug }}/storageState.json
            projects/${{ matrix.brand.slug }}/artifacts/registration-data-current-run.json
            projects/${{ matrix.brand.slug }}/artifacts/last-registered-player.json
            projects/${{ matrix.brand.slug }}/artifacts/last-manual-login-player.json
            projects/${{ matrix.brand.slug }}/artifacts/profile-auth-state.json
            projects/${{ matrix.brand.slug }}/artifacts/site-coverage-auth-state.json
            projects/${{ matrix.brand.slug }}/artifacts/button-sweep-auth-state.json
            projects/${{ matrix.brand.slug }}/test-results/registration-data.json

  nightly_full_matrix:
    name: Nightly Full (${{ matrix.brand.key }} | ${{ matrix.mode }})
    if: ${{ always() }}
    needs: nightly_auth_bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        brand:
          - key: gt
            slug: gt.bet
          - key: likes
            slug: likes.bet
          - key: booms
            slug: booms.bet
          - key: nix
            slug: nix.bet
          - key: starzino
            slug: starzino.com
          - key: igo
            slug: igo.bet
          - key: chacha
            slug: chacha.bet
        mode: [desktop, mobile]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Download nightly auth bootstrap artifact
        id: nightly_auth_bootstrap_download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-auth-${{ matrix.brand.slug }}
          path: .

      - name: Normalize auth-state files for nightly full
        run: |
          set -euo pipefail
          brand_root="projects/${{ matrix.brand.slug }}"
          artifacts_dir="${brand_root}/artifacts"
          mkdir -p "${brand_root}" "${artifacts_dir}"

          if [[ ! -f "${brand_root}/storageState.json" ]]; then
            for candidate in \
              "${artifacts_dir}/profile-auth-state.json" \
              "${artifacts_dir}/site-coverage-auth-state.json" \
              "${artifacts_dir}/button-sweep-auth-state.json"; do
              if [[ -f "${candidate}" ]]; then
                cp "${candidate}" "${brand_root}/storageState.json"
                echo "storageState restored from ${candidate}"
                break
              fi
            done
          fi

          if [[ ! -f "${brand_root}/storageState.json" ]]; then
            echo "::warning::No bootstrap storageState found for ${{ matrix.brand.slug }} (${{ matrix.mode }})."
          fi

      - name: Run deep nightly QA matrix entry
        env:
          PW_HEADED: '0'
          PW_PROVIDER_PROFILE: 'nightly'
          PW_NIGHTLY_ROUTE: '1'
          PW_INCLUDE_DESTRUCTIVE: '1'
          PW_INCLUDE_NIGHTLY_EXTRAS: '1'
          PW_INCLUDE_A11Y: '1'
          PW_INCLUDE_VISUAL: '1'
          PW_VISUAL_REQUIRED: '1'
          PW_VISUAL_REGRESSION: '1'
          PW_CONTRACT_CHECKS: '1'
          PW_WS_CAPTURE: '1'
          PW_USE_AI_GENERATION: '0'
          PW_AI_REQUIRED: '0'
          PW_PRECHECK_SOFT: '1'
          PW_BUTTON_MAX_ROUTES: '50'
          PW_BUTTON_MAX_BUTTONS: '50'
          PW_BUTTON_MAX_ROUTE_DEPTH: '5'
          PW_PROVIDER_MAX: '0'
          PW_PROVIDER_RETRY_ON_FAIL: '0'
          PW_PROVIDER_DESKTOP_GAMES: '1'
          PW_PROVIDER_MIN_GAMES: '1'
          PW_PROVIDER_ENABLE_MOBILE: '1'
          PW_PROVIDER_TEST_TIMEOUT: '120000'
          PW_PROVIDER_MODE_TIMEOUT: '45000'
          PW_SAVE_STATE_TIMEOUT: '120'
        run: npm run qa:all:${{ matrix.brand.key }}:${{ matrix.mode }}

      - name: Upload nightly full artifacts (${{ matrix.brand.key }} | ${{ matrix.mode }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-full-${{ matrix.brand.slug }}-${{ matrix.mode }}
          if-no-files-found: warn
          path: |
            projects/${{ matrix.brand.slug }}/${{ matrix.mode }}/
            projects/${{ matrix.brand.slug }}/Autotest report/${{ matrix.mode }}/

  nightly_providers_matrix:
    name: Nightly Providers (${{ matrix.brand.slug }} | shard ${{ matrix.shard }}/2)
    if: ${{ always() }}
    needs: nightly_auth_bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        brand:
          - key: gt
            slug: gt.bet
          - key: likes
            slug: likes.bet
          - key: booms
            slug: booms.bet
          - key: nix
            slug: nix.bet
          - key: starzino
            slug: starzino.com
          - key: igo
            slug: igo.bet
          - key: chacha
            slug: chacha.bet
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Download nightly auth bootstrap artifact
        id: nightly_auth_bootstrap_download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-auth-${{ matrix.brand.slug }}
          path: .

      - name: Normalize auth-state files for nightly providers
        run: |
          set -euo pipefail
          brand_root="projects/${{ matrix.brand.slug }}"
          artifacts_dir="${brand_root}/artifacts"
          mkdir -p "${brand_root}" "${artifacts_dir}"

          if [[ ! -f "${brand_root}/storageState.json" ]]; then
            for candidate in \
              "${artifacts_dir}/profile-auth-state.json" \
              "${artifacts_dir}/site-coverage-auth-state.json" \
              "${artifacts_dir}/button-sweep-auth-state.json"; do
              if [[ -f "${candidate}" ]]; then
                cp "${candidate}" "${brand_root}/storageState.json"
                echo "storageState restored from ${candidate}"
                break
              fi
            done
          fi

          if [[ ! -f "${brand_root}/storageState.json" ]]; then
            echo "::warning::No bootstrap storageState found for ${{ matrix.brand.slug }} (providers shard ${{ matrix.shard }})."
          fi

      - name: Run providers matrix entry
        env:
          PW_PROVIDER_PROFILE: 'extended'
          PW_PROVIDER_MAX: '40'
          PW_PROVIDER_RETRY_ON_FAIL: '1'
          PW_PROVIDER_DESKTOP_GAMES: '2'
          PW_PROVIDER_MIN_GAMES: '1'
          PW_PROVIDER_ENABLE_MOBILE: '0'
          PW_PROVIDER_TEST_TIMEOUT: '180000'
          PW_PROVIDER_MODE_TIMEOUT: '60000'
          PW_PROVIDER_SHARD_TOTAL: '2'
          PW_PROVIDER_SHARD_INDEX: ${{ matrix.shard }}
        run: npm run qa:providers:${{ matrix.brand.key }}

      - name: Upload nightly providers artifacts (${{ matrix.brand.slug }} | shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-providers-${{ matrix.brand.slug }}-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            projects/${{ matrix.brand.slug }}/Autotest report/desktop/casino/providers-real/
            projects/${{ matrix.brand.slug }}/desktop/test-results/

  nightly_localization_matrix:
    name: Nightly Localization (${{ matrix.brand.key }} | ${{ matrix.mode }} | shard ${{ matrix.shard }}/2)
    if: ${{ always() }}
    needs: nightly_auth_bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        brand:
          - key: gt
            slug: gt.bet
          - key: likes
            slug: likes.bet
          - key: booms
            slug: booms.bet
          - key: nix
            slug: nix.bet
          - key: starzino
            slug: starzino.com
          - key: igo
            slug: igo.bet
          - key: chacha
            slug: chacha.bet
        mode: [desktop, mobile]
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Download nightly auth bootstrap artifact
        id: nightly_auth_bootstrap_download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-auth-${{ matrix.brand.slug }}
          path: .

      - name: Normalize auth-state files for nightly localization
        run: |
          set -euo pipefail
          brand_root="projects/${{ matrix.brand.slug }}"
          artifacts_dir="${brand_root}/artifacts"
          mkdir -p "${brand_root}" "${artifacts_dir}"

          if [[ ! -f "${brand_root}/storageState.json" ]]; then
            for candidate in \
              "${artifacts_dir}/profile-auth-state.json" \
              "${artifacts_dir}/site-coverage-auth-state.json" \
              "${artifacts_dir}/button-sweep-auth-state.json"; do
              if [[ -f "${candidate}" ]]; then
                cp "${candidate}" "${brand_root}/storageState.json"
                echo "storageState restored from ${candidate}"
                break
              fi
            done
          fi

          if [[ ! -f "${brand_root}/storageState.json" ]]; then
            echo "::warning::No bootstrap storageState found for ${{ matrix.brand.slug }} (${{ matrix.mode }} shard ${{ matrix.shard }})."
          fi

      - name: Run localization matrix entry
        env:
          PW_LOCALIZATION_MAX_LANGS: '0'
          PW_LOCALIZATION_ROUTE_MAX: '25'
          PW_LOCALIZATION_ROUTE_CLICKS: '16'
          PW_LOCALIZATION_LINGUISTIC: '1'
          PW_LOCALIZATION_LINGUISTIC_MAX_ISSUES: '10'
          PW_LOCALIZATION_LINGUISTIC_SAMPLE_PAGES: '4'
          PW_LOCALIZATION_LINGUISTIC_MAX_TEXT_CHARS: '2600'
          PW_LOCALIZATION_LINGUISTIC_TIMEOUT_MS: '12000'
        run: npm run qa:localization:${{ matrix.brand.key }}:${{ matrix.mode }} -- --shard=${{ matrix.shard }}/2

      - name: Upload nightly localization artifacts (${{ matrix.brand.key }} | ${{ matrix.mode }} | shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-localization-${{ matrix.brand.slug }}-${{ matrix.mode }}-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            projects/${{ matrix.brand.slug }}/${{ matrix.mode }}/test-results/
            projects/${{ matrix.brand.slug }}/Autotest report/${{ matrix.mode }}/localization/

  nightly_sports_matrix:
    name: Nightly Sports (${{ matrix.brand.key }} | shard ${{ matrix.shard }}/2)
    if: ${{ always() }}
    needs: nightly_auth_bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        brand:
          - key: gt
            slug: gt.bet
          - key: likes
            slug: likes.bet
          - key: booms
            slug: booms.bet
          - key: nix
            slug: nix.bet
          - key: starzino
            slug: starzino.com
          - key: igo
            slug: igo.bet
          - key: chacha
            slug: chacha.bet
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Download nightly auth bootstrap artifact
        id: nightly_auth_bootstrap_download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-auth-${{ matrix.brand.slug }}
          path: .

      - name: Normalize auth-state files for nightly sports
        run: |
          set -euo pipefail
          brand_root="projects/${{ matrix.brand.slug }}"
          artifacts_dir="${brand_root}/artifacts"
          mkdir -p "${brand_root}" "${artifacts_dir}"

          if [[ ! -f "${brand_root}/storageState.json" ]]; then
            for candidate in \
              "${artifacts_dir}/profile-auth-state.json" \
              "${artifacts_dir}/site-coverage-auth-state.json" \
              "${artifacts_dir}/button-sweep-auth-state.json"; do
              if [[ -f "${candidate}" ]]; then
                cp "${candidate}" "${brand_root}/storageState.json"
                echo "storageState restored from ${candidate}"
                break
              fi
            done
          fi

          if [[ ! -f "${brand_root}/storageState.json" ]]; then
            echo "::warning::No bootstrap storageState found for ${{ matrix.brand.slug }} (sports shard ${{ matrix.shard }})."
          fi

      - name: Run sports shard
        env:
          PW_SUITES_ONLY: 'sports'
          PW_SPORTS_SHARD_TOTAL: '2'
          PW_SPORTS_SHARD_INDEX: ${{ matrix.shard }}
          PW_INCLUDE_DESTRUCTIVE: '0'
          PW_USE_AI_GENERATION: '0'
          PW_AI_REQUIRED: '0'
          PW_PRECHECK_SOFT: '1'
        run: npm run qa:all:${{ matrix.brand.key }}:desktop

      - name: Upload nightly sports artifacts (${{ matrix.brand.key }} | shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-sports-${{ matrix.brand.slug }}-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            projects/${{ matrix.brand.slug }}/desktop/
            projects/${{ matrix.brand.slug }}/Autotest report/desktop/
