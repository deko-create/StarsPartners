name: Release On Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (example: v0.1.0)'
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUTS_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "Release tag: ${tag}"
        env:
          INPUTS_TAG: ${{ inputs.tag }}

      - name: Verify tag exists
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git rev-parse "${{ steps.meta.outputs.tag }}" >/dev/null

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          make_latest: true
