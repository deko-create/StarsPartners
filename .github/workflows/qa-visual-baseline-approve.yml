name: QA Visual Baseline Approve

on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Brand key (gt, likes, booms, nix, starzino, igo, chacha, all)'
        required: true
        default: 'gt'
      mode:
        description: 'Execution mode (desktop, mobile, all)'
        required: true
        default: 'desktop'
      browser:
        description: 'Browser for baseline capture (chromium, webkit, firefox)'
        required: true
        default: 'chromium'
      create_pr:
        description: 'Create PR with updated snapshots'
        required: true
        default: 'true'

permissions:
  contents: write
  pull-requests: write

jobs:
  update_visual_baseline:
    name: Update visual baseline (${{ inputs.brand }} | ${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Update visual baselines
        run: npm run qa:visual:baseline:update -- --brand="${INPUTS_BRAND}" --mode="${INPUTS_MODE}" --browser="${INPUTS_BROWSER}"
        env:
          INPUTS_BRAND: ${{ inputs.brand }}
          INPUTS_MODE: ${{ inputs.mode }}
          INPUTS_BROWSER: ${{ inputs.browser }}

      - name: Create PR with snapshot changes
        if: ${{ inputs.create_pr == 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: chore/visual-baseline-${{ inputs.brand }}-${{ inputs.mode }}
          delete-branch: true
          title: 'chore: update visual baselines (${{ inputs.brand }} | ${{ inputs.mode }})'
          body: |
            Automated visual baseline refresh.

            - Brand: `${{ inputs.brand }}`
            - Mode: `${{ inputs.mode }}`
            - Browser: `${{ inputs.browser }}`

            Generated by workflow: `QA Visual Baseline Approve`.
          commit-message: 'chore(visual): refresh baselines for ${{ inputs.brand }} ${{ inputs.mode }}'
          add-paths: |
            tests/visual/**-snapshots/**
